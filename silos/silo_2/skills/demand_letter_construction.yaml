id: demand_letter_construction
name: Wezwanie do zapłaty i wezwanie przedsądowe
description: >
  Buduje szkic wezwania do zapłaty, wezwania do zwrotu świadczenia lub
  przedsądowego wezwania końcowego. Ton: stanowczy, formalny, bez eskalacji.
  Draft only — human review wymagany.
tags: [legal, demand, wezwanie, przedsądowe, windykacja]
version: "1.0"
llm_policy:
  external_llm: true
  anonymize: true
